<!DOCTYPE html>

<head>

    <title>Spokane IT Career Dashboards - Extended</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .category-card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; }

        .category-card ul { list-style: none; }
        .category-card li { padding: 6px 0; }
        .category-card a { color: #3498db; text-decoration: none; font-size: 0.9rem; }
        .category-card a:hover { text-decoration: underline; }
        .nav-links { margin-bottom: 20px; }
        .nav-links a { color: #3498db; text-decoration: none; margin-right: 15px; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spokane IT Career Dashboards - Extended</h1>

        </div>
        <div class="dashboard-grid">
